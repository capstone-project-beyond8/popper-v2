# Default run configuration. Values are read by popper.config (M0).
# Model IDs are Bedrock model or inference-profile IDs enabled in your account.
models:
  code: anthropic.claude-sonnet-4-5          # writes and debugs analysis scripts
  feedback: anthropic.claude-sonnet-4-5      # summarizes nodes, scores, chooses
  vision: anthropic.claude-sonnet-4-5        # reads figures
  writeup: anthropic.claude-sonnet-4-5       # writes the LaTeX report
search:
  num_drafts: 3          # initial root nodes per stage
  debug_prob: 0.5        # chance to debug a buggy node instead of improving the best one
  max_debug_depth: 3     # consecutive debug attempts on one lineage
  steps_per_stage: 8     # node budget per stage
execution:
  timeout_seconds: 300
  max_output_chars: 8000 # stdout/stderr returned to the model
budget:
  max_usd: 5.0
