# Default run configuration. Values are read by popper.harness.config.
# Model IDs are Bedrock inference-profile IDs enabled in your account; POPPER_MODEL overrides all roles.
models:
  theorist: global.anthropic.claude-sonnet-5-5      # frames the research context and proposes hypotheses
  analyst: global.anthropic.claude-sonnet-5-5       # writes and debugs analysis scripts
  judge: global.anthropic.claude-sonnet-5-5         # summarizes nodes, scores, chooses
  writer: global.anthropic.claude-sonnet-5-5        # writes the LaTeX report
search:
  num_drafts: 3          # initial root nodes per stage
  debug_prob: 0.5        # chance to debug a buggy node instead of improving the best one
  max_debug_depth: 3     # consecutive debug attempts on one lineage
  steps_per_stage: 6     # node budget per stage
  max_turns: 12          # model turns per node agent
  good_score: 7          # stop once the best node reaches this score...
  patience: 2            # ...and has not improved for this many steps
  stage_steps:
    baseline: 3
    main: 6
    robustness: 6
execution:
  timeout_seconds: 300
  max_output_chars: 8000 # stdout/stderr returned to the model
data:
  holdout_fraction: 0.2
  split_seed: 7
  group_column: null
robustness:
  stability_share: 0.8
  min_variants: 3
understand:
  max_turns: 30          # model turns for the theorist framing session
  max_submits: 3         # rejected framing submits before the session fails
  max_questions: 5       # questions the theorist may put to the researcher
  max_reframes: 1        # re-framings after the data steward reports a problem
ground:
  max_turns: 40          # model turns for the data steward session
  max_submits: 3         # rejected preparation submits before the session fails
budget:
  max_usd: 5.0
  prices:                    # USD per million tokens; a key matches a model id containing it
    sonnet: {input: 3.0, output: 15.0}  # confirm against the Bedrock price list
    haiku: {input: 1.0, output: 5.0}    # confirm against the Bedrock price list

discovery:
  hypotheses: 3
  max_moves: 4
  max_revisits: 1
